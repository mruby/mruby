name: Release Builds

on:
  push:
    tags:
      - "*.*.*"

permissions: read-all

jobs:
  source:
    name: Source Code Releasing
    if: ${{ github.repository == 'mruby/mruby' }}
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
    steps:
      - name: "Checkout ${{ github.ref_name }} ( ${{ github.sha }} )"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Builds
        id: builds
        run: |
          tagname="$GITHUB_REF_NAME"
          packagename="mruby-$tagname"
          destdir=packages

          # `git archive` writes the tree of one repository, so the Prism
          # submodule under mruby-compiler comes out as an empty directory
          # and the archive does not build (#7608). Lay the tag's tree out
          # in a staging directory, put each submodule's tree in its place,
          # and pack that. The archives GitHub makes from a tag have the
          # same hole, which is why the README points at these.
          stage="$(mktemp -d)"
          mkdir -p "$destdir" "$stage/$packagename"
          git archive --format tar "$GITHUB_REF" | tar -C "$stage/$packagename" -x
          git submodule foreach --quiet --recursive \
            "git archive --format tar HEAD | tar -C \"$stage/$packagename/\$displaypath\" -x"

          tar -C "$stage" -cf - "$packagename" | gzip -9 > "$destdir/$packagename.tar.gz"
          tar -C "$stage" -cf - "$packagename" | xz > "$destdir/$packagename.tar.xz"
          (cd "$stage" && zip -qr -9 "$OLDPWD/$destdir/$packagename.zip" "$packagename")
          rm -rf "$stage"

          (
            cd "$destdir" || exit
            sha256sum -- * > .sha256
            mv .sha256 "$packagename.sha256"
          )
      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          body_path: NEWS.md
          files: packages/*
