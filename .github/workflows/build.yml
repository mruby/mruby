# https://github.com/actions/runner-images#available-images
name: Build & Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  GCC-CLANG:
    name: "${{ matrix.os }}-${{ matrix.altname || matrix.cc }}"
    runs-on: ${{ matrix.os }}
    # A row that installs a toolchain is given room for that step's own
    # budget on top of the work: 15 is what the rest of a job takes at
    # worst, and an apt allowed 10 minutes does not fit beside it.  The
    # rows that install nothing keep the 15 the whole job costs them.
    timeout-minutes: ${{ matrix.timeout || 15 }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          # x86-64 LP64 with signed plain `char`.  These two also run the
          # stress tests (test/assert.rb, `stress`): what those check is
          # neither ABI nor compiler specific, and they are the bulk of a
          # suite's running time, many times so under MRB_GC_STRESS.
          - {os: ubuntu-24.04, cc: gcc, cxx: g++, stress: "1"}
          - {os: ubuntu-24.04, cc: clang, cxx: clang++, stress: "1"}
          # Also the one that builds with C++ exceptions in C: see
          # build_config/ci/gcc-clang.rb.
          - {os: ubuntu-22.04, cc: gcc, cxx: g++, cxx_exception: "1"}
          - {os: ubuntu-22.04, cc: clang, cxx: clang++}
          # AArch64 LP64 with unsigned plain `char`.
          - {os: ubuntu-24.04-arm, cc: gcc, cxx: g++}
          # x86 ILP32 with signed plain `char`.
          - os: ubuntu-24.04
            cc: i686-linux-gnu-gcc
            cxx: i686-linux-gnu-g++
            altname: "i686-gcc"
            apt: "crossbuild-essential-i386"
            timeout: 25
          # AArch32 ILP32 with unsigned plain `char`, run under qemu.  The
          # emulation is why this one says so: see build_config/ci/gcc-clang.rb.
          - os: ubuntu-24.04
            cc: arm-linux-gnueabihf-gcc
            cxx: arm-linux-gnueabihf-g++
            altname: "armhf-gcc"
            apt: "crossbuild-essential-armhf binfmt-support qemu-user-static"
            qemu_ld_prefix: "/usr/arm-linux-gnueabihf"
            emulated: "1"
            abi_only: "1"
            timeout: 25
          # AArch64 LP64 with signed plain `char`.
          - {os: macos-26, cc: clang, cxx: clang++}
          - {os: macos-15, cc: clang, cxx: clang++}
          # x86-64 LLP64 with signed plain `char`.
          # The mingw compiler is what costs here: the suites finish in under
          # a minute together while the seven builds take ten of the job's
          # fifteen, so this runner is asked for its ABI and not for what
          # reads the same everywhere.  See build_config/ci/gcc-clang.rb.
          - os: windows-2025
            cc: gcc
            cxx: g++
            altname: "mingw-gcc"
            abi_only: "1"
          - os: windows-2022
            cc: gcc
            cxx: g++
            altname: "mingw-gcc"
            abi_only: "1"
    env:
      MRUBY_CONFIG: ci/gcc-clang
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      LD: ${{ matrix.cc }}
      MRUBY_CI_EMULATED: ${{ matrix.emulated }}
      MRUBY_CI_ABI_ONLY: ${{ matrix.abi_only }}
      MRUBY_CI_CXX_EXCEPTION: ${{ matrix.cxx_exception }}
      MRBTEST_STRESS: ${{ matrix.stress }}
      QEMU_LD_PREFIX: ${{ matrix.qemu_ld_prefix }}
    steps:
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      # The toolchain is about 65 MB of .deb files, and the runner's Ubuntu
      # mirror has served them at 40 kB/s while its package index came at
      # 10 MB/s, timing the install out on most pushes.  The files are kept
      # in the Actions cache under a key naming the exact files apt would
      # fetch, so a run downloads only what changed since one that saved.
      # Hashing names, sizes and checksums, not URLs, keeps the key
      # independent of which mirror the runner was given.
      - name: List cross-build toolchain packages
        if: matrix.apt
        id: apt
        run: |
          sudo apt-get update
          sum=$(apt-get install --print-uris -qq -y --no-install-recommends \
            -o Dir::Cache::Archives="$RUNNER_TEMP/apt-none" ${{ matrix.apt }} |
            awk '{print $2, $3, $4}' | sha256sum | cut -c1-16)
          echo "prefix=apt-${{ matrix.os }}-${{ matrix.altname }}-" >> "$GITHUB_OUTPUT"
          echo "sum=$sum" >> "$GITHUB_OUTPUT"
      - name: Restore cross-build toolchain packages
        if: matrix.apt
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.apt.outputs.prefix }}${{ steps.apt.outputs.sum }}
          restore-keys: ${{ steps.apt.outputs.prefix }}
      # 10 for a run that finds nothing cached: the download has taken more
      # than five minutes.  The job is given 25 so that an apt using all ten
      # still leaves the build and the suites their fifteen.
      - name: Install cross-build toolchain
        if: matrix.apt
        id: apt-install
        timeout-minutes: 10
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get install -y --no-install-recommends \
            -o Dir::Cache::Archives="$HOME/apt-archives" ${{ matrix.apt }}
      # Also after an install that timed out: the files it did fetch are
      # saved under a key of their own, which the next run restores by
      # prefix and completes, so a slow mirror costs a rerun rather than
      # failing every run the same way.  Only a complete set takes the key
      # an exact restore looks for.
      - name: Tidy cross-build toolchain packages
        if: >-
          always() && steps.apt-install.outcome != 'skipped' &&
          steps.apt-cache.outputs.cache-hit != 'true'
        id: apt-tidy
        run: |
          sudo apt-get autoclean -o Dir::Cache::Archives="$HOME/apt-archives"
          sudo rm -rf ~/apt-archives/partial ~/apt-archives/lock
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives
          if [ "${{ steps.apt-install.outcome }}" != success ]; then
            echo "suffix=-partial-${{ github.run_id }}-${{ github.run_attempt }}"
          fi >> "$GITHUB_OUTPUT"
      - name: Save cross-build toolchain packages
        if: always() && steps.apt-tidy.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.apt.outputs.prefix }}${{ steps.apt.outputs.sum }}${{ steps.apt-tidy.outputs.suffix }}
      - name: Ruby version
        run: ruby -v
      - name: Compiler version
        run: ${{ env.CC }} --version
      - name: Defines
        run: rake defines
      - name: Build
        run: rake -m test:build
      - name: Size
        run: rake size
      - name: Test
        run: rake test:run

  Cosmopolitan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Ruby version
        run: ruby -v
      - name: Cache cosmocc
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-cosmocc
        with:
          path: ~/cosmo
          key: cosmocc-${{ runner.os }}-20260104
      - name: Install cosmocc
        if: steps.cache-cosmocc.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/cosmo && cd ~/cosmo
          wget https://cosmo.zip/pub/cosmocc/cosmocc.zip
          unzip cosmocc.zip
      - name: Defines
        run: |
          COSMO_ROOT=~/cosmo rake defines MRUBY_CONFIG=cosmopolitan
      - name: Build
        run: |
          COSMO_ROOT=~/cosmo rake -m test:build MRUBY_CONFIG=cosmopolitan
      - name: Size
        run: |
          COSMO_ROOT=~/cosmo rake size MRUBY_CONFIG=cosmopolitan
      - name: Test
        run: |
          COSMO_ROOT=~/cosmo rake test:run MRUBY_CONFIG=cosmopolitan

  Windows-VC:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      MRUBY_CONFIG: ci/msvc
    steps:
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Ruby version
        run: ruby -v
      - name: Defines
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          rake defines
      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          rake -m test:build
      - name: Size
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          rake size
      - name: Test
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          rake test:run
