# https://github.com/actions/runner-images#available-images
name: Build & Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  GCC-CLANG:
    name: "${{ matrix.os }}-${{ matrix.altname || matrix.cc }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          # x86-64 LP64 with signed plain `char`.
          - {os: ubuntu-24.04, cc: gcc, cxx: g++}
          - {os: ubuntu-24.04, cc: clang, cxx: clang++}
          - {os: ubuntu-22.04, cc: gcc, cxx: g++}
          - {os: ubuntu-22.04, cc: clang, cxx: clang++}
          # AArch64 LP64 with unsigned plain `char`.
          - {os: ubuntu-24.04-arm, cc: gcc, cxx: g++}
          # x86 ILP32 with signed plain `char`.
          - os: ubuntu-24.04
            cc: i686-linux-gnu-gcc
            cxx: i686-linux-gnu-g++
            altname: "i686-gcc"
          # AArch32 ILP32 with unsigned plain `char`, run under qemu.  The
          # emulation is why this one says so: see build_config/ci/gcc-clang.rb.
          - os: ubuntu-24.04
            cc: arm-linux-gnueabihf-gcc
            cxx: arm-linux-gnueabihf-g++
            altname: "armhf-gcc"
            emulated: "1"
          # AArch64 LP64 with signed plain `char`.
          - {os: macos-26, cc: clang, cxx: clang++}
          - {os: macos-15, cc: clang, cxx: clang++}
          # x86-64 LLP64 with signed plain `char`.
          - {os: windows-2025, cc: gcc, cxx: g++, altname: "mingw-gcc"}
          - {os: windows-2022, cc: gcc, cxx: g++, altname: "mingw-gcc"}
    env:
      MRUBY_CONFIG: ci/gcc-clang
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      LD: ${{ matrix.cc }}
      MRUBY_CI_EMULATED: ${{ matrix.emulated }}
    steps:
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install i386 cross-build toolchain
        if: matrix.altname == 'i686-gcc'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            crossbuild-essential-i386
      - name: Install armhf cross-build toolchain
        if: matrix.altname == 'armhf-gcc'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            crossbuild-essential-armhf binfmt-support qemu-user-static
          echo 'QEMU_LD_PREFIX=/usr/arm-linux-gnueabihf' >> "$GITHUB_ENV"
      - name: Ruby version
        run: ruby -v
      - name: Compiler version
        run: ${{ env.CC }} --version
      - name: Build and test
        run: rake -m test:run:serial

  Cosmopolitan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ruby version
        run: ruby -v
      - name: Cache cosmocc
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-cosmocc
        with:
          path: ~/cosmo
          key: cosmocc-${{ runner.os }}-20260104
      - name: Install cosmocc
        if: steps.cache-cosmocc.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/cosmo && cd ~/cosmo
          wget https://cosmo.zip/pub/cosmocc/cosmocc.zip
          unzip cosmocc.zip
      - name: Build and test
        run: |
          COSMO_ROOT=~/cosmo rake -m test:run:serial MRUBY_CONFIG=cosmopolitan

  Windows-VC:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      MRUBY_CONFIG: ci/msvc
    steps:
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ruby version
        run: ruby -v
      - name: Build and test
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          rake -m test:run:serial
